

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyMap</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
}
header {
  height: 65px;
  background: #111827;
  color: white;
  display: flex;
  align-items: center;
  padding: 0 16px;
  font-size: 23px;
  font-weight: bold;
}
.logo { color: #38bdf8; margin-right: 10px; }
.search {
  display: flex;
  padding: 10px;
  background: white;
  gap: 7px;
}
input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
}
button {
  border: none;
  background: #0284c7;
  color: white;
  padding: 12px 15px;
  border-radius: 10px;
  font-size: 15px;
}
#map {
  width: 100%;
  height: calc(100dvh - 145px);
}
.bottom {
  background: #111827;
  color: white;
  height: 80px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  font-size: 13px;
}
.bottom div { text-align: center; }
.bottom span {
  display: block;
  font-size: 22px;
  margin-bottom: 5px;
}
.leaflet-control-attribution { font-size: 9px !important; }
</style>
</head>

<body>
<header>
  <span class="logo">✦</span> MyMap
</header>

<div class="search">
  <input id="searchBox" placeholder="Search places...">
  <button onclick="searchPlace()">Search</button>
</div>

<div id="map"></div>

<div class="bottom">
  <div onclick="goHome()"><span>⌂</span>Home</div>
  <div onclick="locateMe()"><span>◎</span>My Location</div>
  <div onclick="map.zoomIn()"><span>＋</span>Zoom In</div>
  <div onclick="map.zoomOut()"><span>－</span>Zoom Out</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([22.3569, 91.7832], 13);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let marker;

function locateMe() {
  if (!navigator.geolocation) {
    alert('Location is not supported.');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      map.setView([lat, lng], 16);

      if (marker) map.removeLayer(marker);

      marker = L.marker([lat, lng])
        .addTo(map)
        .bindPopup('Your Current Location')
        .openPopup();
    },
    function() {
      alert('Location permission দিন অথবা GPS চালু করুন।');
    },
    { enableHighAccuracy: true }
  );
}

async function searchPlace() {
  const query = document.getElementById('searchBox').value.trim();

  if (!query) {
    alert('একটি জায়গার নাম লিখুন।');
    return;
  }

  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&q=' + encodeURIComponent(query);

    const response = await fetch(url);
    const results = await response.json();

    if (!results.length) {
      alert('জায়গাটি পাওয়া যায়নি।');
      return;
    }

    const place = results[0];
    const lat = Number(place.lat);
    const lng = Number(place.lon);

    map.setView([lat, lng], 16);

    if (marker) map.removeLayer(marker);

    marker = L.marker([lat, lng])
      .addTo(map)
      .bindPopup(place.display_name)
      .openPopup();

  } catch (error) {
    alert('ইন্টারনেট সংযোগ পরীক্ষা করুন।');
  }
}

function goHome() {
  map.setView([22.3569, 91.7832], 13);
}

document.getElementById('searchBox')
  .addEventListener('keydown', function(e) {
    if (e.key === 'Enter') searchPlace();
  });
</script>
</body>
</html>
